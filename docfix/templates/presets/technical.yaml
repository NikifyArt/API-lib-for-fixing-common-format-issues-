name: technical
description: Neutral sans-serif with a strong monospace face and tight spacing. For engineering docs, specifications, and READMEs.

markdown:
  bullet_marker: "-"
  emphasis_marker: "*"
  strong_marker: "**"
  heading_style: atx
  thematic_break: "---"
  wrap_width: 80

fonts:
  body:    {family: "'Inter', 'Helvetica Neue', system-ui, sans-serif", size: 10}
  heading: {family: "'Inter', 'Helvetica Neue', system-ui, sans-serif", size: 15, weight: 600}
  mono:    {family: "'JetBrains Mono', 'SF Mono', Consolas, monospace", size: 9}

spacing:
  line_height: 1.45
  paragraph_after: 10
  heading_before: 18
  heading_after: 6

colors:
  text: "#111827"
  heading: "#111827"
  accent: "#2563eb"
  muted: "#6b7280"
  link: "#2563eb"
