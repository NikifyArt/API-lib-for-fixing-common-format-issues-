# Pinned fonts: the set docfix installs for reproducible PDF output.
#
# Data, like catalog.yaml. Adding a font means adding an entry here.
#
# Why this exists: PDF output otherwise depends on whichever fonts a machine
# happens to have, so the same CV renders differently on a laptop and in CI.
# `docfix fonts install` fetches this set into a cache the pool prefers, so
# output is identical anywhere the install has been run.
#
# Every URL pins a **commit SHA**, not a branch or tag, so the bytes cannot
# change under us. The sha256 is verified on download and again on `--check`;
# a mismatch is a hard failure, never a warning.
#
# Every entry was verified before being added, by reading the font itself:
# TrueType outlines (reportlab loads nothing else), fsType 0 meaning embedding
# is unrestricted, and an OFL-1.1 licence declared by the font's own name
# table. The licence text is fetched alongside and stored in the cache.
#
# Coverage measured from each cmap: Lato and Noto Sans cover Latin, Latin
# Extended, Cyrillic and Greek; IBM Plex covers Latin and Cyrillic. Noto Sans
# is the widest and sits in the fallback chain.

