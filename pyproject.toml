[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docfix"
version = "0.1.0"
description = "Find and fix common formatting problems in documents -- Prettier, but for .md, .docx, .pdf and CVs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Nik" }]
keywords = ["formatting", "markdown", "docx", "pdf", "documents", "templates"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Fonts",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
    # tomllib is stdlib from 3.11; requires-python allows 3.10.
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
# Phase 2-4 format support, kept optional so a Markdown-only install stays light.
docx = ["python-docx>=1.1"]
pdf = ["reportlab>=4.0", "pypdf>=4.0", "pdfplumber>=0.11"]
all = ["docfix[docx,pdf]"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
docfix = "docfix.cli:main"
# PyPI renders these as the project page's sidebar. Without them an adopter
# landing on the page has no route to the source, the changelog, or a bug.
[project.urls]
Homepage = "https://github.com/NikifyArt/API-lib-for-fixing-common-format-issues-"
Source = "https://github.com/NikifyArt/API-lib-for-fixing-common-format-issues-"
Issues = "https://github.com/NikifyArt/API-lib-for-fixing-common-format-issues-/issues"
Changelog = "https://github.com/NikifyArt/API-lib-for-fixing-common-format-issues-/blob/main/CHANGELOG.md"
Documentation = "https://github.com/NikifyArt/API-lib-for-fixing-common-format-issues-/blob/main/docs/EXTENDING.md"

[tool.setuptools.packages.find]
include = ["docfix*"]

[tool.setuptools.package-data]
# Data files the package loads at runtime. An editable install resolves these
# from the source tree whether or not they are declared here, so a missing
# entry only shows up in a real wheel -- build one to check.
# py.typed marks the package as typed (PEP 561); without it a consumer's
# mypy or pyright treats every docfix import as Any, hints or no hints.
docfix = ["templates/presets/*.yaml", "fonts/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["docfix"]
# The optional extras are genuinely optional, so a Markdown-only run leaves the
# PDF and DOCX adapters unexecuted. Measure in the `dev,all` shape or the number
# is meaningless.
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
